[global]
   workgroup = BOMSOSSEGO
   netbios name = FS01
   server string = Servidor de arquivos
   interfaces = 10.20.0.20
   bind interfaces only = yes
   smb ports = 445
   disable netbios = yes
   security = user
   map to guest = never
   server min protocol = NT1
   server signing = auto
   load printers = no
   printcap name = /dev/null
   lock directory = /run/samba-fs01/lock
   state directory = /run/samba-fs01/state
   cache directory = /run/samba-fs01/cache
   private dir = /run/samba-fs01/private
   pid directory = /run/samba-fs01
   ncalrpc dir = /run/samba-fs01/ncalrpc
   log file = /var/log/samba-fs01.log
   log level = 0

[Publico]
   comment = Arquivos publicos da Prefeitura
   path = /srv/fs01/publico
   read only = yes

[Financas]
   comment = Secretaria de Financas
   path = /srv/fs01/financas
   valid users = adm.financas
   read only = yes

[RH$]
   comment = Recursos Humanos
   path = /srv/fs01/rh
   valid users = clodoaldo.ti
   read only = yes
