[global]
   workgroup = BOMSOSSEGO
   netbios name = DC01
   server string = Controlador de dominio da Prefeitura
   interfaces = 10.20.0.10
   bind interfaces only = yes
   smb ports = 445
   disable netbios = yes
   security = user
   map to guest = never
   server signing = mandatory
   load printers = no
   printcap name = /dev/null
   lock directory = /run/samba-dc01/lock
   state directory = /run/samba-dc01/state
   cache directory = /run/samba-dc01/cache
   private dir = /run/samba-dc01/private
   pid directory = /run/samba-dc01
   ncalrpc dir = /run/samba-dc01/ncalrpc
   log file = /var/log/samba-dc01.log
   log level = 0

[NETLOGON]
   path = /srv/dc01/netlogon
   read only = yes
   browseable = yes

[SYSVOL]
   path = /srv/dc01/sysvol
   read only = yes
   browseable = yes
