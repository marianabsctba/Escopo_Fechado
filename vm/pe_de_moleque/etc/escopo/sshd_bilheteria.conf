ListenAddress 10.30.0.15
Port 22
HostKey /etc/escopo/ssh/ssh_host_ed25519_key
PidFile /run/sshd-bilheteria.pid
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile /etc/ssh/chaves/%u
AllowUsers auditor
PermitRootLogin no
ChrootDirectory /srv/bilheteria
X11Forwarding no
AllowTcpForwarding no
Banner /etc/escopo/ssh/banner
PrintMotd no
